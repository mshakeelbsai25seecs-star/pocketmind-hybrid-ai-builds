<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PocketMind Hybrid AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Conductor shell — never leave a slate/blue void while React boots */
      html, body, #root { width: 100%; height: 100%; margin: 0; background: #fafafa; color: #0a0a0a; font-family: Inter, "Segoe UI", system-ui, sans-serif; }
      html.dark, html.dark body, html.dark #root { background: #000000; color: #fafafa; }
    </style>
    <script>
      (function () {
        try {
          var theme = 'system';
          var raw = localStorage.getItem('nexus-ai-storage');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.state && parsed.state.theme) theme = parsed.state.theme;
          }
          var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          document.documentElement.style.backgroundColor = dark ? '#000000' : '#fafafa';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
