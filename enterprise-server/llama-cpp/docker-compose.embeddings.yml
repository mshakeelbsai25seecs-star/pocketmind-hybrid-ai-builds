services:
  # Code partition embeddings (Qwen3-Embedding-8B). Requires --pooling last.
  nexusai-embed-code:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: nexusai-embed-code
    restart: unless-stopped
    ports:
      - "${CODE_EMBED_PORT:-8001}:8001"
    volumes:
      - ./models:/models
    command:
      - -m
      - ${CODE_EMBED_MODEL_PATH:-/models/Qwen3-Embedding-8B-Q4_K_M.gguf}
      - --embeddings
      - --pooling
      - last
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - -c
      - ${EMBED_CTX_SIZE:-8192}
      - -ngl
      - ${EMBED_GPU_LAYERS:--1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Knowledge partition embeddings (BGE-M3). Mean pooling.
  nexusai-embed-knowledge:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: nexusai-embed-knowledge
    restart: unless-stopped
    ports:
      - "${KNOWLEDGE_EMBED_PORT:-8002}:8002"
    volumes:
      - ./models:/models
    command:
      - -m
      - ${KNOWLEDGE_EMBED_MODEL_PATH:-/models/bge-m3-Q4_K_M.gguf}
      - --embeddings
      - --pooling
      - mean
      - --host
      - 0.0.0.0
      - --port
      - "8002"
      - -c
      - ${EMBED_CTX_SIZE:-8192}
      - -ngl
      - ${EMBED_GPU_LAYERS:--1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
