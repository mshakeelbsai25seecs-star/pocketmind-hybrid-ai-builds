services:
  nexusai-llama-cpp-cuda:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: nexusai-llama-cpp-cuda
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./models:/models
    command:
      - -m
      - ${MODEL_PATH:-/models/model.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - -c
      - ${CTX_SIZE:-4096}
      - -ngl
      - ${GPU_LAYERS:--1}
      - -t
      - ${THREADS:-8}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
