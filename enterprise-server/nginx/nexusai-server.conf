# NexusAI internal reverse proxy example.
# Production deployments should add TLS, token checks, and company firewall rules.

server {
    listen 80;
    server_name nexusai.internal;

    client_max_body_size 100m;

    # Health check page
    location = /health {
        return 200 "NexusAI gateway is running\n";
        add_header Content-Type text/plain;
    }

    # OpenAI-compatible API pass-through
    location /v1/ {
        proxy_pass http://127.0.0.1:8000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Important for streaming responses
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
