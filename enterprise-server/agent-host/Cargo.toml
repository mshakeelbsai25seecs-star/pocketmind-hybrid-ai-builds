[package]
name = "pocketcode-agent-host"
version = "0.1.0"
edition = "2021"
description = "PocketMind Hybrid AI remote agent-host (workspace tools + provisioning)"
publish = false

[lib]
name = "pocketcode_agent_host"
path = "src/lib.rs"

[[bin]]
name = "pocketcode-agent-host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["json"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
flate2 = "1"
pocketcode-workspace = { path = "../../crates/pocketcode-workspace" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
