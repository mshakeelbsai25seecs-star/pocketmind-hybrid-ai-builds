# NexusAI Full Server RAG — NVIDIA GPU primary stack
# Usage:
#   cp .env.example .env && ./scripts/setup.sh
# CPU fallback: docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d

services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: nexusai-rag-llm
    restart: unless-stopped
    ports:
      - "${LLM_PORT:-8000}:8000"
    volumes:
      - ${NEXUS_MODELS_HOST:-/opt/nexusai/models}:/models:ro
    command:
      - -m
      - ${LLM_MODEL_PATH:-/models/llm/Qwen2.5-7B-Instruct-Q4_K_M.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - -c
      - ${CTX_SIZE:-8192}
      - -ngl
      - ${GPU_LAYERS:--1}
      - -t
      - ${THREADS:-8}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s

  embed-code:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: nexusai-rag-embed-code
    restart: unless-stopped
    ports:
      - "${CODE_EMBED_PORT:-8001}:8001"
    volumes:
      - ${NEXUS_MODELS_HOST:-/opt/nexusai/models}:/models:ro
    command:
      - -m
      - ${CODE_EMBED_MODEL_PATH:-/models/embeddings/Qwen3-Embedding-8B-Q4_K_M.gguf}
      - --embeddings
      - --pooling
      - last
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - -c
      - ${EMBED_CTX_SIZE:-8192}
      - -ngl
      - ${GPU_LAYERS:--1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 90s

  embed-knowledge:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: nexusai-rag-embed-knowledge
    restart: unless-stopped
    ports:
      - "${KNOWLEDGE_EMBED_PORT:-8002}:8002"
    volumes:
      - ${NEXUS_MODELS_HOST:-/opt/nexusai/models}:/models:ro
    command:
      - -m
      - ${KNOWLEDGE_EMBED_MODEL_PATH:-/models/embeddings/bge-m3-Q4_K_M.gguf}
      - --embeddings
      - --pooling
      - mean
      - --host
      - 0.0.0.0
      - --port
      - "8002"
      - -c
      - ${EMBED_CTX_SIZE:-8192}
      - -ngl
      - ${GPU_LAYERS:--1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 90s

  rerank:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: nexusai-rag-rerank
    restart: unless-stopped
    ports:
      - "${RERANK_PORT:-8003}:8003"
    volumes:
      - ${NEXUS_MODELS_HOST:-/opt/nexusai/models}:/models:ro
    command:
      - -m
      - ${RERANK_MODEL_PATH:-/models/rerankers/Qwen3-Reranker-4B-Q4_K_M.gguf}
      - --reranking
      - --pooling
      - rank
      - --embedding
      - --host
      - 0.0.0.0
      - --port
      - "8003"
      - -c
      - ${EMBED_CTX_SIZE:-8192}
      - -ngl
      - ${GPU_LAYERS:--1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8003/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 90s

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: nexusai-rag-gateway:local
    container_name: nexusai-rag-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      NEXUS_DATA_ROOT: /opt/nexusai/data
      NEXUSAI_SERVER_TOKEN: ${NEXUSAI_SERVER_TOKEN}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm:8000/v1}
      EMBED_CODE_URL: ${EMBED_CODE_URL:-http://embed-code:8001/v1}
      EMBED_KNOWLEDGE_URL: ${EMBED_KNOWLEDGE_URL:-http://embed-knowledge:8002/v1}
      NEXUS_RERANK_URL: ${NEXUS_RERANK_URL:-http://rerank:8003}
      BIND: ${BIND:-0.0.0.0:8080}
    volumes:
      - ${NEXUS_DATA_HOST:-/opt/nexusai/data}:/opt/nexusai/data
      - ${NEXUS_MODELS_HOST:-/opt/nexusai/models}:/opt/nexusai/models:ro
    depends_on:
      - llm
      - embed-code
      - embed-knowledge
      - rerank
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
