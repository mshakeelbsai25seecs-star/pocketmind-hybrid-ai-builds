# NVIDIA GPU overlay — only used when Docker GPU access is verified.
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build

services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command:
      - -m
      - ${LLM_MODEL_PATH:-/models/llm/Qwen2.5-7B-Instruct-Q4_K_M.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - -c
      - ${CTX_SIZE:-8192}
      - -ngl
      - ${GPU_LAYERS:--1}
      - -t
      - ${THREADS:-8}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  embed-code:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command:
      - -m
      - ${CODE_EMBED_MODEL_PATH:-/models/embeddings/Qwen3-Embedding-8B-Q4_K_M.gguf}
      - --embeddings
      - --pooling
      - last
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - -c
      - ${EMBED_CTX_SIZE:-8192}
      - -ngl
      - ${GPU_LAYERS:--1}
      - -t
      - ${THREADS:-8}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  embed-knowledge:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command:
      - -m
      - ${KNOWLEDGE_EMBED_MODEL_PATH:-/models/embeddings/bge-m3-Q4_K_M.gguf}
      - --embeddings
      - --pooling
      - mean
      - --host
      - 0.0.0.0
      - --port
      - "8002"
      - -c
      - ${EMBED_CTX_SIZE:-8192}
      - -ngl
      - ${GPU_LAYERS:--1}
      - -t
      - ${THREADS:-8}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  rerank:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command:
      - -m
      - ${RERANK_MODEL_PATH:-/models/rerankers/Qwen3-Reranker-4B-Q4_K_M.gguf}
      - --reranking
      - --pooling
      - rank
      - --embedding
      - --host
      - 0.0.0.0
      - --port
      - "8003"
      - -c
      - ${EMBED_CTX_SIZE:-8192}
      - -ngl
      - ${GPU_LAYERS:--1}
      - -t
      - ${THREADS:-8}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
