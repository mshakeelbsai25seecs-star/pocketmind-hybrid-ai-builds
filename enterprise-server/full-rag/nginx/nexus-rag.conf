# Optional reverse proxy in front of the NexusAI RAG gateway (port 8080).
# Production deployments should add TLS, rate limits, and firewall rules.

upstream nexus_rag_gateway {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name nexus-rag.internal;

    client_max_body_size 50m;

    location = /health {
        proxy_pass http://nexus_rag_gateway/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://nexus_rag_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
