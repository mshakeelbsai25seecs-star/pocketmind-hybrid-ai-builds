services:
  nexusai-llama-cpp-cpu:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: nexusai-llama-cpp-cpu
    restart: on-failure:3
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./models:/models
    command:
      - -m
      - ${MODEL_PATH:-/models/model.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - -c
      - ${CTX_SIZE:-4096}
      - -ngl
      - "0"
      - -t
      - ${THREADS:-8}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000'"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s

