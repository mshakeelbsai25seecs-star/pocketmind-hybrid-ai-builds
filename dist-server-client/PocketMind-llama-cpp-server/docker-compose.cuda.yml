services:
  nexusai-llama-cpp-cuda:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: nexusai-llama-cpp-cuda
    # Prefer failing visibly over infinite silent restart loops on bad/missing GGUF.
    restart: on-failure:3
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./models:/models
    command:
      - -m
      - ${MODEL_PATH:-/models/model.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - -c
      - ${CTX_SIZE:-4096}
      - -ngl
      - ${GPU_LAYERS:--1}
      - -t
      - ${THREADS:-8}
    healthcheck:
      # Minimal image may lack curl/wget; bash /dev/tcp is enough to see "listening".
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000'"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 90s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
