[package]
name = "pocketcode-workspace"
version = "0.1.0"
edition = "2021"
description = "Shared PocketCode workspace tools (path jail, FS tools, sandbox, checkpoints, plans)"
publish = false

[dependencies]
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
flate2 = "1"

[dev-dependencies]
tempfile = "3"
