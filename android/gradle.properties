# Project-wide Gradle settings.

# JVM heap and metaspace tuning for the Gradle daemon.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Enable the Gradle daemon and parallel/caching for faster builds.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# Hilt 2.52 does not fully support KSP2 yet (AndroidEntryPoint / void signature bugs).
ksp.useKSP2=false
